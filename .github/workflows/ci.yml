name: CI

on:
  push:
    branches: [main, "*.x"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: signy-dev
      # Not on npm yet, package.json takes signy from ../signy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alopia/signy
          path: signy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: signy-dev/.tool-versions
      - run: npm ci && npm run build
        working-directory: signy
      - run: npm ci
        working-directory: signy-dev
      # ESLint, Prettier, typecheck, tests and the build
      - run: npm run check
        working-directory: signy-dev
